name: Run one read-only signed-in buyer catalog diagnostic
# Capture initial account-reset state before any manual initializer diagnostics.
on:
  push:
    branches: [test/staging-reporting]
    paths: ['.github/workflows/launch-catalog-auth-live.yml']
permissions:
  contents: read
  actions: write
jobs:
  launch:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Request one staging buyer auth and catalog check without fixtures
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "repos/${{ github.repository }}/actions/workflows/private-staging.yml/dispatches" -f ref=test/staging-reporting -F 'inputs[focused_live_test]=staging-catalog-auth-live'
