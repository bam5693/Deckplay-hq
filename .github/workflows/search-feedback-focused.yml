name: Focused private support and search feedback checks
on:
  workflow_dispatch:
  push:
    branches: [test/staging-reporting]
    paths:
      - '.github/workflows/search-feedback-focused.yml'
      - 'support-center.js'
      - 'tests/e2e/support-center.spec.js'
permissions:
  contents: read
concurrency:
  group: deckplay-search-feedback-${{ github.ref }}
  cancel-in-progress: true
jobs:
  focused-ui:
    if: github.ref == 'refs/heads/test/staging-reporting'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Cheap preflight
        run: |
          node scripts/check-inline-js.cjs
          node --check support-center.js
          node --check tests/e2e/support-center.spec.js
      - name: Cache Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: staging-playwright-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install chromium --only-shell
      - name: Focused T7.5 feedback and T8.3 ticket topic filtering on mobile and desktop
        run: |
          npx playwright test --config=playwright.local.config.js support-center.spec.js --grep 'T7.6:|T7.5:|T8.3: ticket topic filters|T8.3: staff safety queue|T8.3: delayed staff status failure|T8.3: collector tickets load while optional staff authorization|T8.4: oversized listing report retains draft and does not submit' --project=local-desktop --project=local-mobile --max-failures=1 --timeout=20000
