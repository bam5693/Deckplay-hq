name: Deploy isolated staging website
on:
  workflow_dispatch:
  push:
    branches: [test/staging-reporting]
    paths-ignore: ['tests/reports/**']

permissions:
  contents: read

concurrency:
  group: deckplay-staging-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: deckplay-staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify staging deployment credentials
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CF_API_TOKEN" ] || [ -z "$CF_ACCOUNT_ID" ]; then
            echo "::error::Configure CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in deckplay-staging environment."
            exit 1
          fi
      - name: Build staging-only assets
        env:
          DECKPLAY_STAGING_SUPABASE_URL: https://prrrzeelltmyugssqnzk.supabase.co
          DECKPLAY_STAGING_SUPABASE_KEY: sb_publishable_0omvNnv_ZOvXrZ-LHPMyIQ_a9zxD-yh
        run: node scripts/build-staging.cjs
      - run: node scripts/build-staging-worker.cjs
      - name: Deploy separate Worker (never production)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config wrangler.staging.jsonc
      - name: Save staging deployment manifest
        run: |
          printf 'Worker: deckplay-hq-staging\nSupabase: prrrzeelltmyugssqnzk\nCommit: %s\n' "$GITHUB_SHA" > staging-deployment.txt
      - uses: actions/upload-artifact@v4
        with:
          name: deckplay-staging-deployment
          path: staging-deployment.txt
          retention-days: 7
