name: Deploy isolated staging website
on:
  workflow_dispatch:
  # Connector-launchable deployment: updating this single request file triggers
  # one staging-only deployment. Ordinary feature commits do not deploy.
  push:
    branches: [test/staging-reporting]
    paths: ['tests/reports/staging-deploy-request.txt']

permissions:
  contents: read

concurrency:
  group: deckplay-staging-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.ref == 'refs/heads/test/staging-reporting' }}
    runs-on: ubuntu-latest
    environment: deckplay-staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify staging deployment credentials
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CF_API_TOKEN" ] || [ -z "$CF_ACCOUNT_ID" ]; then
            echo "::error::Configure CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in deckplay-staging environment."
            exit 1
          fi
      - name: Verify staging Worker target and immutable private gate
        run: |
          node --check scripts/build-staging.cjs
          node --check scripts/build-staging-worker.cjs
          node --check scripts/staging-handler.js
          grep -q '"name": "deckplay-hq-staging"' wrangler.staging.jsonc
          grep -q 'STAGING_ACCESS_PASSWORD' scripts/staging-handler.js
      - name: Build staging-only assets
        env:
          DECKPLAY_STAGING_SUPABASE_URL: https://prrrzeelltmyugssqnzk.supabase.co
          DECKPLAY_STAGING_SUPABASE_KEY: sb_publishable_0omvNnv_ZOvXrZ-LHPMyIQ_a9zxD-yh
        run: node scripts/build-staging.cjs
      - run: node scripts/build-staging-worker.cjs
      - name: Deploy separate Worker (never production)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config wrangler.staging.jsonc
      - name: Confirm private staging gate after deployment
        run: |
          node -e 'fetch("https://deckplay-hq-staging.cstivers56.workers.dev",{method:"HEAD",redirect:"manual",signal:AbortSignal.timeout(15000)}).then(r=>{if(r.status!==401||!/^Basic/i.test(r.headers.get("www-authenticate")||""))throw Error("Private staging authentication gate not verified");console.log("Private staging still denies anonymous requests")}).catch(e=>{console.error(e.message);process.exitCode=1})'
      - name: Save staging deployment manifest
        run: |
          printf 'Worker: deckplay-hq-staging\nSupabase: prrrzeelltmyugssqnzk\nCommit: %s\n' "$GITHUB_SHA" > staging-deployment.txt
      - uses: actions/upload-artifact@v4
        with:
          name: deckplay-staging-deployment
          path: staging-deployment.txt
          retention-days: 7
