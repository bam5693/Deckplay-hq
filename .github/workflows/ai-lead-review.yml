name: Private AI lead review (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reviewer:
    if: github.ref == 'refs/heads/test/staging-reporting'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    environment: deckplay-staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify lead reviewer safety tests
        run: node --test tests/security/ai-leads.test.mjs
      - name: Deploy isolated AI reviewer only with existing staging Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          REVIEWER_TOKEN: ${{ secrets.DECKPLAY_AI_REVIEWER_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$REVIEWER_TOKEN" ]; then
            echo 'Reviewer not deployed: requires Cloudflare credentials and a separate DECKPLAY_AI_REVIEWER_TOKEN secret.'
            exit 1
          fi
          npx --yes wrangler@4 deploy --config wrangler.ai-reviewer.jsonc
          printf '%s' "$REVIEWER_TOKEN" | npx --yes wrangler@4 secret put REVIEWER_TOKEN --config wrangler.ai-reviewer.jsonc
      - name: Explain verification boundary
        if: always()
        run: |
          echo '## Tanner and Jayden' >> "$GITHUB_STEP_SUMMARY"
          echo 'Deploy alone does not prove live AI inference. Verify authenticated model response and quota before declaring online. Never add this to production.' >> "$GITHUB_STEP_SUMMARY"
