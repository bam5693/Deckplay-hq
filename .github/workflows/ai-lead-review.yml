name: Private AI lead review (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reviewer:
    if: github.ref == 'refs/heads/test/staging-reporting'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    environment: deckplay-staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify lead reviewer safety tests
        run: node --test tests/security/ai-leads.test.mjs
      - name: Deploy isolated AI reviewer only with existing staging Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          REVIEWER_TOKEN: ${{ secrets.DECKPLAY_AI_REVIEWER_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$REVIEWER_TOKEN" ]; then
            echo 'Reviewer not deployed: requires Cloudflare credentials and a separate DECKPLAY_AI_REVIEWER_TOKEN secret.'
            exit 1
          fi
          npx --yes wrangler@4 deploy --config wrangler.ai-reviewer.jsonc
          printf '%s' "$REVIEWER_TOKEN" | npx --yes wrangler@4 secret put REVIEWER_TOKEN --config wrangler.ai-reviewer.jsonc
      - name: Verify both AI leads actually respond
        env:
          REVIEWER_TOKEN: ${{ secrets.DECKPLAY_AI_REVIEWER_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          const url='https://deckplay-hq-ai-reviewer-staging.cstivers56.workers.dev';
          const evidence='Synthetic staging scenario: a buyer opens a card listing, sends an offer, and the seller accepts. After refreshing the mobile inbox, the buyer still sees the offer as pending. This is fictional test evidence, not a real user transaction.';
          for(const lead of ['Tanner','Jayden']){
            const res=await fetch(url,{method:'POST',headers:{Authorization:'Bearer '+process.env.REVIEWER_TOKEN,'Content-Type':'application/json'},body:JSON.stringify({lead,evidence})});
            const body=await res.json();
            if(!res.ok||body.lead!==lead||typeof body.report!=='string'||!body.report.trim())throw Error(lead+' did not return a real AI report (HTTP '+res.status+')');
            console.log(lead+' returned a live AI review ('+body.report.length+' characters)');
          }
          NODE
      - name: Explain verification boundary
        if: always()
        run: |
          echo '## Tanner and Jayden' >> "$GITHUB_STEP_SUMMARY"
          echo 'Deploy alone does not prove live AI inference. Verify authenticated model response and quota before declaring online. Never add this to production.' >> "$GITHUB_STEP_SUMMARY"
