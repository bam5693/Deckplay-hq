name: Inbox jump-to-latest focused regression
on:
  workflow_dispatch:
  pull_request:
    branches: [test/staging-reporting]
    paths:
      - index.html
      - tests/e2e/inbox-recovery.spec.js
      - .github/workflows/inbox-jump-latest-focused.yml
permissions:
  contents: read
jobs:
  focused:
    # Avoid unrelated Inbox browser runs on Trunk 1 listing-only PR updates.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref != 'dev/hourly-trunk1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node scripts/check-inline-js.cjs && node --check tests/e2e/inbox-recovery.spec.js
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: staging-playwright-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install chromium --only-shell
      - name: Long Inbox history and jump-to-latest mobile and desktop
        run: npx playwright test --config=playwright.local.config.js inbox-recovery.spec.js --grep 'T2.3 Jump to latest' --retries=0 --max-failures=1 --timeout=20000
