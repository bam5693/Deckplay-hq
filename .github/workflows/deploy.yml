name: Deploy DeckPlay HQ to Cloudflare Workers

on:
  workflow_dispatch:

concurrency:
  group: deckplay-hq-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    environment: production
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate inline JavaScript
        run: node scripts/check-inline-js.cjs
      - name: Install browser test dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run isolated local UI simulations
        run: npx playwright test --config=playwright.local.config.js
      - name: Publish to existing Cloudflare Worker
        run: npx --yes wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: e020177f6d966343794328bb3bdcec6f
