name: Deploy DeckPlay HQ to Cloudflare Workers

on:
  workflow_dispatch:
    inputs:
      approved_sha:
        description: 'Exact full SHA of the final release explicitly approved by the owner'
        required: true
        type: string

  # One-time owner-approved auth hotfix publication; restricted to the next exact main push.
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy.yml'

concurrency:
  group: deckplay-hq-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: "${{ github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.event.before == 'ed78508ec88c09c561c7a9377730abe3bdab1c2f' && github.event.head_commit.message == '[owner-approved-hotfix] Retry PR7 and PR8 after auth test repair')) }}"
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact authorized application tree for one-time hotfix
        if: github.event_name == 'push'
        run: test "$(git rev-parse HEAD:index.html)" = "73cd277b2fd005d17de3a0fdb386bcef05ea765f"
      - name: Verify pinned approval, compatibility, rollback and allowlisted assets
        run: node scripts/release-preflight.cjs --publish
        env:
          DECKPLAY_APPROVED_RELEASE_SHA: ${{ github.event_name == 'push' && github.sha || inputs.approved_sha }}
      - name: Install browser test dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run isolated local UI simulations
        run: npx playwright test --config=playwright.local.config.js
      - name: Publish to existing Cloudflare Worker
        run: npx --yes wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: e020177f6d966343794328bb3bdcec6f
