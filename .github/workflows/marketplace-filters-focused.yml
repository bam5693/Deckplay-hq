name: Marketplace filters focused verification
on:
  push:
    branches: [test/staging-reporting]
    paths: ['.github/workflows/marketplace-filters-focused.yml']
permissions:
  contents: read
concurrency:
  group: deckplay-marketplace-filter-verification
  cancel-in-progress: false
jobs:
  focused-filters:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Check syntax and staging build
        run: |
          node scripts/check-inline-js.cjs
          node --check tests/e2e/marketplace-filter-boundaries.spec.js
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: marketplace-filter-chromium-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install chromium --only-shell
      - name: Verify T1.2 marketplace filter and recovery behavior on mobile and desktop
        run: npx playwright test --config=playwright.local.config.js marketplace-filter-boundaries.spec.js --retries=0 --max-failures=1 --timeout=20000
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: marketplace-filter-focused-results
          path: |
            test-results/local-junit.xml
            test-results/local/
          if-no-files-found: ignore
          retention-days: 3
