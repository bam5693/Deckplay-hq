  focused-live-diagnostic:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/test/staging-reporting' && github.event.inputs.focused_live_test != 'none' && github.event.inputs.focused_live_test != '' }}
    name: One signed-in staging workflow, fail fast
    runs-on: ubuntu-latest
    timeout-minutes: 9
    environment: deckplay-staging
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Use existing trusted staging-only identity exchange
        run: node scripts/staging-ci-credentials.cjs
      - run: npm ci
      - name: Minimal safe staging preflight
        run: |
          node scripts/check-inline-js.cjs
          node --test tests/security/staging-browser-config.test.cjs tests/security/fixture-cleanup.test.cjs
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: staging-playwright-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install chromium --only-shell
      - name: Run only the selected signed-in browser journey on private staging
        env:
          SELECTED_TEST: ${{ github.event.inputs.focused_live_test }}
        run: |
          case "$SELECTED_TEST" in
            trading|listing-drafts-live|seller-pause-live|staging-catalog-auth-live|community|seller-overview-live|discovery-alerts|staging-permissions|t2-buyer-seller-messaging-live) ;;
            *) echo "Unsupported diagnostic selection"; exit 1;;
          esac
          if [ "$SELECTED_TEST" = "staging-permissions" ]; then
            npx playwright test --config=playwright.staging.config.js staging-permissions.spec.js --project=staging-desktop --grep 'collector session survives page refresh' --retries=0 --max-failures=1 --timeout=45000
          else
            npx playwright test --config=playwright.staging.config.js "${SELECTED_TEST}.spec.js" --project=staging-desktop --retries=0 --max-failures=1 --timeout=120000
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: private-staging-single-journey-diagnostic
          path: |
            test-results/staging-junit.xml
            test-results/staging/
            playwright-report/staging/
          if-no-files-found: warn
          retention-days: 3

  report-failure:
    name: Report staging failures without stopping tests
    needs: [staging-identity, staging-accounts]
    if: ${{ always() && contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      issues: write
      actions: read
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const title='[Staging] Private feature bots failed';
            const link=process.env.GITHUB_SERVER_URL+'/'+process.env.GITHUB_REPOSITORY+'/actions/runs/'+process.env.GITHUB_RUN_ID;
            const {data:items}=await github.rest.issues.listForRepo({...context.repo,state:'open',per_page:100});
            const issue=items.find(i=>!i.pull_request&&i.title===title);
            const {data:jobsPage}=await github.rest.actions.listJobsForWorkflowRun({...context.repo,run_id:context.runId,per_page:100});
            const failures=jobsPage.jobs.filter(j=>j.conclusion==='failure').map(j=>{
              const steps=(j.steps||[]).filter(s=>s.conclusion==='failure').map(s=>'- '+s.name).slice(0,8);
              return '**'+j.name+'**\\n'+(steps.length?steps.join('\\n'):'- Check job logs')+'\\n'+j.html_url;
            });
            const body=['**Failed staging run:** '+link,'**Commit:** '+context.sha,'**Failed jobs and steps:**',...(failures.length?failures:['Job details unavailable; inspect run logs.']),'Artifacts: private-staging-feature-report (retained 3 days).','Staging only; do not modify production.'].join('\\n\\n');
            if(issue) await github.rest.issues.createComment({...context.repo,issue_number:issue.number,body});
            else await github.rest.issues.create({...context.repo,title,body});


  release-preview-acceptance:
    if: ${{ github.event_name == 'push' && startsWith(github.event.head_commit.message, '[release-preview]') && github.ref == 'refs/heads/test/staging-reporting' }}
    name: Pinned private release preview signed desktop and mobile journeys
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: deckplay-staging
    concurrency:
      group: private-staging-transactions
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Read exact release pin
        id: pin
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const {sha}=JSON.parse(fs.readFileSync('tests/reports/release-preview-request.json'));
          if(!/^[a-f0-9]{40}$/.test(sha))throw Error('Full release SHA required');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'sha='+sha+'\n');
          NODE
      - name: Existing repository and workflow scoped staging credential exchange
        run: node scripts/staging-ci-credentials.cjs
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.pin.outputs.sha }}
      - name: Build pinned preview and run one cheap auth and source smoke
        env:
          DECKPLAY_STAGING_SUPABASE_URL: https://prrrzeelltmyugssqnzk.supabase.co
          DECKPLAY_STAGING_SUPABASE_KEY: sb_publishable_0omvNnv_ZOvXrZ-LHPMyIQ_a9zxD-yh
        run: |
          node scripts/build-staging.cjs
          node scripts/build-release.cjs --preview
          node scripts/verify-release-preview.cjs
          echo 'DECKPLAY_STAGING_URL=https://deckplay-hq-release-preview.cstivers56.workers.dev' >> "$GITHUB_ENV"
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: staging-playwright-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install chromium --only-shell
      - name: Actual signed preview listing, search, Favorites, Inbox, price and bundle trade journeys
        run: npx playwright test --config=playwright.release-preview.config.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pinned-release-preview-acceptance
          path: test-results/release-preview-junit.xml
          if-no-files-found: ignore
          retention-days: 3
