          node --test tests/security/staging-browser-config.test.cjs tests/security/fixture-cleanup.test.cjs
      - name: Verify real signed-in feedback submission with one synthetic bot ticket
        if: ${{ success() && github.event_name == 'push' && startsWith(github.event.head_commit.message, '[feedback-live]') }}
        run: npx playwright test --config=playwright.staging.config.js feedback-live.spec.js --project=staging-desktop --retries=0 --max-failures=1 --timeout=60000
      - name: Minimal focused preflight for signed synthetic transaction
        if: ${{ github.event_name == 'push' && startsWith(github.event.head_commit.message, '[focused-history]') }}
        run: |
          node --check tests/e2e/negotiation-history-live.spec.js
          node --test tests/security/staging-browser-config.test.cjs tests/security/fixture-cleanup.test.cjs
      - name: Verify one real signed-in negotiation history journey with exact fixture cleanup
        if: ${{ success() && github.event_name == 'push' && startsWith(github.event.head_commit.message, '[focused-history]') }}
        run: npx playwright test --config=playwright.staging.config.js negotiation-history-live.spec.js --project=staging-desktop --retries=0 --max-failures=1 --timeout=45000
      - name: T2 minimal signed-message and fixture preflight
        if: ${{ github.event_name == 'push' && startsWith(github.event.head_commit.message, '[t2-live]') }}
