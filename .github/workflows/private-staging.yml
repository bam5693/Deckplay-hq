name: Private staging feature bots
on:
  workflow_dispatch:
  push:
    branches: [test/staging-reporting]
    paths-ignore: ['tests/reports/**']
permissions:
  contents: read
  id-token: write
jobs:
  staging-identity:
    permissions:
      contents: read
      id-token: write
      actions: write
    name: Verify trusted staging runner identity
    runs-on: ubuntu-latest
    timeout-minutes: 3
    environment: deckplay-staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/staging-ci-credentials.cjs
      - name: Clear superseded staging runs
        env:
          GH_RUN_CONTROL_TOKEN: ${{ github.token }}
        run: node scripts/cancel-superseded-staging.cjs
  staging-accounts:
    needs: staging-identity
    concurrency:
      group: private-staging-transactions
      cancel-in-progress: false
    name: Real staging API and mobile/desktop buyer-seller journeys
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: deckplay-staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Authenticate using repository-scoped GitHub identity
        run: node scripts/staging-ci-credentials.cjs
      - run: npm ci
      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: staging-playwright-${{ hashFiles('package-lock.json') }}
      - name: Verify staging API transactions and authorization
        run: |
          mkdir -p test-results
          set -o pipefail
          node scripts/run-staging-api.cjs 2>&1 | tee test-results/staging-api.tap
      - name: Install browser for deployed UI journeys
        if: ${{ !cancelled() }}
        run: npx playwright install chromium --only-shell
        timeout-minutes: 8
      - name: Verify deployed mobile and desktop buyer-seller journeys
        if: ${{ !cancelled() && env.DECKPLAY_STAGING_URL != '' }}
        run: npx playwright test --config=playwright.staging.config.js
      - name: Save durable staging feature result
        if: ${{ !cancelled() && env.DECKPLAY_STAGING_URL != '' }}
        env:
          STAGING_JOB_STATUS: ${{ job.status }}
        run: node scripts/report-staging-results.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: private-staging-feature-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 3
      - name: Summarize feature bot result
        if: always()
        run: |
          echo '## Real staging feature bots' >> "$GITHUB_STEP_SUMMARY"
          echo 'Result: ${{ job.status }}. Reports include API assertions, mobile/desktop journeys, traces and screenshots. Payment/shipping remain previews. See coverage matrix for external-service limits.' >> "$GITHUB_STEP_SUMMARY"
