name: Trade offer modal contrast mobile and desktop
on:
  pull_request:
    branches: [test/staging-reporting]
    paths:
      - index.html
      - playwright.local.config.js
      - tests/e2e/trade-modal-contrast.spec.js
      - .github/workflows/trade-modal-contrast-focused.yml
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node scripts/check-inline-js.cjs && node --check tests/e2e/trade-modal-contrast.spec.js
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: staging-playwright-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install chromium --only-shell
      - run: npx playwright test --config=playwright.local.config.js trade-modal-contrast.spec.js --retries=0 --max-failures=1 --timeout=20000
