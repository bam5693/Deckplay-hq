name: Trunk 1 classification priority focused check
on:
  push:
    branches: [dev/hourly-trunk1]
    paths:
      - 'listing-editor-classification.js'
      - 'tests/e2e/listing-editor.spec.js'
      - '.github/workflows/trunk1-classification-focused.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  seller-classification:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Syntax and inline JavaScript preflight
        run: |
          node --check listing-editor-classification.js
          node --check tests/e2e/listing-editor.spec.js
          node scripts/check-inline-js.cjs
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: staging-playwright-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install chromium --only-shell
      - name: One seller edit metadata regression (local synthetic only)
        run: npx playwright test --config=playwright.local.config.js tests/e2e/listing-editor.spec.js --grep 'T1.3 latest edited classification wins' --retries=0 --timeout=20000
