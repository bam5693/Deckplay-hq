name: Report staging test failures
on:
  workflow_run:
    workflows:
      - Private staging feature bots
      - DeckPlay browser tests
    types: [completed]
permissions:
  contents: read
  issues: write
jobs:
  report:
    if: ${{ github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.head_branch == 'test/staging-reporting' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Create or update staging failure issue
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const title = '[Staging] Automated test failure: ' + run.name;
            const body = [
              'Automated staging-only failure report.',
              '',
              '**Workflow:** ' + run.name,
              '**Run:** ' + run.html_url,
              '**Commit:** ' + run.head_sha,
              '**Conclusion:** ' + run.conclusion,
              '',
              'Inspect the failed job logs and artifacts before changing code.',
              'Keep production, payment, shipping, and security settings unchanged.',
              'Fixes must be reviewed and retested on test/staging-reporting.'
            ].join('\n');
            const {data: issues} = await github.rest.issues.listForRepo({
              ...context.repo, state:'open', per_page:100
            });
            const existing = issues.find(i => !i.pull_request && i.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                ...context.repo, issue_number:existing.number,
                body:'Another staging failure: ' + run.html_url + '\nCommit: ' + run.head_sha
              });
            } else {
              await github.rest.issues.create({...context.repo,title,body});
            }
