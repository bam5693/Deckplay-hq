name: T5 narrow listing preview mobile browser acceptance
on:
  push:
    branches: [test/staging-reporting]
    paths: ['.github/workflows/t5-listing-preview-focused.yml', 'tests/e2e/listing-contents-preview.spec.js']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  layout:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Cheap source preflight
        run: |
          node scripts/check-inline-js.cjs
          node --check tests/e2e/listing-contents-preview.spec.js
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: staging-playwright-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install chromium --only-shell
      - name: Verify actual narrow-phone listing preview layout
        run: npx playwright test --config=playwright.local.config.js listing-contents-preview.spec.js --grep 'T5 narrow phone listing preview' --project=local-mobile --retries=0 --max-failures=1 --timeout=20000
