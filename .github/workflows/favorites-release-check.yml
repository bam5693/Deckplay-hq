name: Favorites release checks
on:
  pull_request:
    paths:
      - 'favorite-actions.js'
      - 'index.html'
      - 'tests/security/favorite-actions-regression.test.cjs'
      - '.github/workflows/favorites-release-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  favorites:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate homepage and Favorites JavaScript syntax
        run: |
          node --check favorite-actions.js
          node scripts/check-inline-js.cjs
      - name: Test Favorites save, remove and rollback behavior
        run: node --test tests/security/favorite-actions-regression.test.cjs
      - name: Install project test dependencies
        run: npm install --no-save --package-lock=false @playwright/test
      - name: Install Playwright Chromium shell
        run: npx playwright install chromium --only-shell
      - name: Run isolated mobile and desktop homepage smoke checks
        run: npx playwright test tests/e2e/smoke.spec.js --config=playwright.local.config.js
      - name: Verify production homepage includes controller and delegates favorite actions
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          const html = fs.readFileSync('index.html', 'utf8');
          assert.match(html, /<script src="\.\/favorite-actions\.js"><\/script>/);
          assert.match(html, /await window\.favoriteActions\.toggle\(heart\.dataset\.heart\)/);
          assert.ok(!html.includes('const wasSaved=saved.has(id);wasSaved?saved.delete(id):saved.add(id);render();const item=items.find'));
          const controller = fs.readFileSync('favorite-actions.js', 'utf8');
          for (const variable of ['listingAccountVersion', 'savedListingsLoadVersion']) {
            if (!html.includes(variable)) assert.match(controller, new RegExp('typeof ' + variable + "===?'undefined'|typeof " + variable + "!=='undefined'"), 'Missing compatibility guard for ' + variable);
          }
          console.log('Homepage Favorites wiring and production compatibility verified');
          NODE
