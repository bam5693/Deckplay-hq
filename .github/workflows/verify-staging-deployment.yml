name: Verify staging deployment only (low-cost)
on:
  workflow_dispatch:
  push:
    branches: [test/staging-reporting]
    paths: ['tests/reports/staging-parity-request.txt']

permissions:
  contents: read

jobs:
  verify:
    name: Compare deployed homepage with staging branch
    if: github.ref == 'refs/heads/test/staging-reporting'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    environment: deckplay-staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build expected staging assets without deploying
        env:
          DECKPLAY_STAGING_SUPABASE_URL: https://prrrzeelltmyugssqnzk.supabase.co
          DECKPLAY_STAGING_SUPABASE_KEY: sb_publishable_0omvNnv_ZOvXrZ-LHPMyIQ_a9zxD-yh
        run: node scripts/build-staging.cjs
      - name: Verify all served assets, private gate and exact staging branch
        env:
          DECKPLAY_STAGING_URL: https://deckplay-hq-staging.cstivers56.workers.dev
          DECKPLAY_STAGING_ACCESS_PASSWORD: ${{ secrets.DECKPLAY_STAGING_ACCESS_PASSWORD }}
        run: node scripts/verify-staging-assets.cjs
