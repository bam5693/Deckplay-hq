name: Trunk 8 private operator queue focused check
on:
  push:
    branches: [dev/hourly-trunk8]
    paths:
      - 'moderation.js'
      - 'moderation.html'
      - 'supabase/staging/moderation-review-history.sql'
      - 'tests/e2e/moderation-security.spec.js'
      - '.github/workflows/hourly-trunk8-focused.yml'
permissions:
  contents: read
concurrency:
  group: trunk8-local-${{ github.ref }}
  cancel-in-progress: true
jobs:
  local-only:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Cheap syntax preflight
        run: |
          node --check moderation.js
          node -e "const s=require('fs').readFileSync('supabase/staging/moderation-review-history.sql','utf8');if(!s.includes('deckplay_admin.has_moderator_access()')||!s.includes('security invoker')||!s.includes('limit 20'))throw Error('Unsafe review-history SQL')"
          node --check tests/e2e/moderation-security.spec.js
          node -e "const s=require('fs').readFileSync('moderation.html','utf8');for(const id of ['incidentPanel','incidentKind','incidentImpact','incidentPrepare','incidentCopy','incidentSummary','incidentStatus'])if(!s.includes('id=\\\"'+id+'\\\"'))throw Error('Missing incident control: '+id)"
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: staging-playwright-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install chromium --only-shell
      - name: T8.4 read-only review history local mock only (desktop and mobile)
        run: |
          npx playwright test --config=playwright.local.config.js moderation-security.spec.js --grep 'T8.4: private review history is MFA-scoped, readable and cleared on account exit' --project=local-desktop --project=local-mobile --max-failures=1 --timeout=20000
