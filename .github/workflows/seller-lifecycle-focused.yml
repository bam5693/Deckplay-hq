name: Seller lifecycle acceptance preflight
# Preserve seller Mark sold behavior; cover paused inventory count and the corrected direct-filter fixture.
on:
  push:
    branches: [test/staging-reporting]
    paths: ['.github/workflows/seller-lifecycle-focused.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  seller-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Lowest-cost syntax, migration contract and stage build
        run: |
          node scripts/check-inline-js.cjs
          node --check tests/e2e/seller-pause.spec.js
          node --check tests/e2e/seller-inventory.spec.js
          node --check tests/e2e/seller-overview.spec.js
          node --check tests/e2e/seller-overview-live.spec.js
          node --check seller-overview.js
          node --check scripts/build-staging.cjs
          grep -q "paused" supabase/staging/seller-listing-pause.sql
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: staging-playwright-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install chromium --only-shell
      - name: Seller lifecycle plus paused-stock summary and direct inventory navigation on desktop and mobile
        run: npx playwright test --config=playwright.local.config.js seller-pause.spec.js seller-inventory.spec.js seller-overview.spec.js --retries=0 --max-failures=1 --timeout=20000
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: seller-lifecycle-test-failure
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 3
