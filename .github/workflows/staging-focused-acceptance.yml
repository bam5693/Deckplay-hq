name: Focused local marketplace regression
# Deliberately no deployed-account credentials: the private staging OIDC gate
# only trusts private-staging.yml. Do not widen that trust for this workflow.
on:
  workflow_dispatch:
  push:
    branches: [test/staging-reporting]
    paths: ['tests/reports/staging-acceptance-request.txt']
permissions:
  contents: read
jobs:
  local-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: staging-playwright-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install chromium --only-shell
      - name: Validate isolated staging support and first-time buyer/seller journeys
        env:
          DECKPLAY_STAGING_SUPABASE_URL: https://prrrzeelltmyugssqnzk.supabase.co
          DECKPLAY_STAGING_SUPABASE_KEY: sb_publishable_0omvNnv_ZOvXrZ-LHPMyIQ_a9zxD-yh
        run: |
          node scripts/build-staging.cjs
          node --check scripts/build-staging-worker.cjs
          node scripts/check-inline-js.cjs
          node --check support-center.js
          node --check support-center.js
          node --check tests/e2e/support-center.spec.js
          node --check tests/e2e/getting-started.spec.js
          npx playwright test --config=playwright.local.config.js support-center.spec.js support-center.spec.js --retries=0 --max-failures=1 --timeout=20000
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: focused-marketplace-regression-failure
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 3
