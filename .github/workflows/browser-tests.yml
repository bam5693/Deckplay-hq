name: DeckPlay browser tests
on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - 'tests/e2e/**'
      - 'playwright.config.js'
      - 'package.json'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
