name: DeckPlay browser tests
on:
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
concurrency:
  group: browser-tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Verify staging runner authorization boundaries
        run: node --test tests/security/staging-oidc.test.mjs
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-linux-${{ hashFiles('package-lock.json') }}
      - name: Install Chromium dependencies
        run: npx playwright install-deps chromium
      - name: Install Chromium browser
        run: npx playwright install chromium
      - name: Run mobile and desktop browser tests
        run: npx playwright test --config=playwright.local.config.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deckplay-browser-results
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Summarize verified browser result
        if: always()
        run: |
          echo "## Isolated mobile and desktop UI checks" >> "$GITHUB_STEP_SUMMARY"
          echo "Status: ${{ job.status }}. See attached HTML report, JUnit, screenshots and traces. This job does not certify real buyer/seller API transactions." >> "$GITHUB_STEP_SUMMARY"
