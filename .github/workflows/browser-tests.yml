name: DeckPlay browser tests
on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - 'tests/e2e/**'
      - 'playwright.config.js'
      - 'package.json'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-linux-${{ hashFiles('package-lock.json') }}
      - name: Install Chromium dependencies
        run: npx playwright install-deps chromium
      - name: Install Chromium browser
        run: npx playwright install chromium
      - name: Run mobile and desktop browser tests
        run: npx playwright test --config=playwright.local.config.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deckplay-browser-results
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
