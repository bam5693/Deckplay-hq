name: Prepare staging assets
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build isolated staging site
        env:
          DECKPLAY_STAGING_SUPABASE_URL: ${{ vars.DECKPLAY_STAGING_SUPABASE_URL }}
          DECKPLAY_STAGING_SUPABASE_KEY: ${{ vars.DECKPLAY_STAGING_SUPABASE_KEY }}
        run: node scripts/build-staging.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: deckplay-staging-assets
          path: dist-staging/
