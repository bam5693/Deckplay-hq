name: Run isolated DeckPlay staging checks
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  dispatch-staging:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch existing staging test workflow on staging branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST repos/${{ github.repository }}/actions/workflows/private-staging.yml/dispatches -f ref=test/staging-reporting
