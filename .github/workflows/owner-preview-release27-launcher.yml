name: Dispatch explicitly approved PR27 through protected production workflow
on:
  push:
    branches: [main]
    paths:
      - release/gates.json
permissions:
  contents: read
  actions: write
concurrency:
  group: deckplay-owner-approved-pr27-launcher
  cancel-in-progress: false
jobs:
  dispatch:
    if: "${{ github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, 'Merge pull request #27 from release/owner-preview-v1-2026-10-31') }}"
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Check owner approval and exact reviewed production application blob
        run: |
          node <<'NODE'
          const fs=require('node:fs'),{execFileSync}=require('node:child_process');
          const g=JSON.parse(fs.readFileSync('release/gates.json','utf8'));
          const approval=g.ownerPreviewRelease27Approval;
          const actual=execFileSync('git',['rev-parse','HEAD:index.html'],{encoding:'utf8'}).trim();
          const parents=execFileSync('git',['rev-list','--parents','-n','1','HEAD'],{encoding:'utf8'}).trim().split(/\s+/).slice(1);
          if(parents.length!==2||actual!=='025759167624d03e0aaf34de9c82800ce06cc731'||g.approvedApplicationTree!=='025759167624d03e0aaf34de9c82800ce06cc731'||
             approval?.approvedApplicationTree!=='025759167624d03e0aaf34de9c82800ce06cc731'||
             approval?.approvedSourceCandidateCommit!=='920859155efb764c5c9ce955cee1cd0dc170cce4'||
             approval?.managedServiceRecoveryVerified!==false||
             approval?.previousWaiverForPR5NotReused!==true||
             g.blockers.length!==0||
             g.productionSchemaVerified!==true||
             g.previewAcceptanceVerified!==true||
             g.rollbackVerified!==true)throw Error('PR27 exact owner approval, tree, or release gate missing');
          console.log('Owner-approved PR27 merge application verified; dispatching existing protected production workflow.');
          NODE
      - name: Dispatch protected manual production workflow with exact merged main SHA
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main --field approved_sha="${GITHUB_SHA}"
