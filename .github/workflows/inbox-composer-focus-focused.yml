name: Focused Inbox composer focus recovery
on:
  pull_request:
    branches: [test/staging-reporting]
    paths:
      - 'index.html'
      - 'tests/e2e/inbox-recovery.spec.js'
      - '.github/workflows/inbox-composer-focus-focused.yml'
permissions:
  contents: read
jobs:
  focused-local:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Cheap syntax preflight
        run: |
          node scripts/check-inline-js.cjs
          node --check tests/e2e/inbox-recovery.spec.js
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: staging-playwright-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install chromium --only-shell
      - name: Check composer focus in desktop and mobile browsers
        run: npx playwright test --config=playwright.local.config.js inbox-recovery.spec.js --grep 'T2.2:' --retries=0 --max-failures=1 --timeout=20000
