<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Moderation | DeckPlay HQ</title><style>body{margin:0;background:#f5f7fb;color:#172033;font:15px/1.5 system-ui,sans-serif}header{background:#14213d;color:white;padding:20px 5%}header a{color:#e8bc61}main{max-width:980px;margin:auto;padding:24px 5%}.card{background:white;border:1px solid #dce2eb;border-radius:14px;padding:20px;margin:14px 0}small{color:#69748a}pre{white-space:pre-wrap;overflow-wrap:anywhere}button{background:#14213d;color:white;border:0;border-radius:8px;padding:10px 16px;cursor:pointer}</style></head><body><header><a href="/">← DeckPlay HQ</a><h1>Moderation dashboard</h1></header><main><div class="card" id="state">Checking your moderator access…</div><div id="reports"></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script><script>(async()=>{const state=document.getElementById('state'),out=document.getElementById('reports');try{const client=window.supabase.createClient('https://yffruutknztvdyioovmp.supabase.co','sb_publishable_cHzM8sQmrqfcCH8lhESytg_FMJrQtCX');const {data:{user},error:authError}=await client.auth.getUser();if(authError||!user){state.textContent='Sign in to DeckPlay first, then return to this page.';return}const {data:allowed,error:roleError}=await client.rpc('is_deckplay_moderator');if(roleError||allowed!==true){state.textContent='Access restricted to DeckPlay moderators.';return}state.textContent='Private report queue. Report status changes and listing removals are logged. Account suspension is not yet enabled.';const {data,error}=await client.rpc('moderation_report_queue');if(error)throw error;if(!data?.length){out.textContent='No reports in the queue.';return}for(const report of data){const div=document.createElement('section');div.className='card';const heading=document.createElement('h2');heading.textContent=report.reason||'Report';div.append(heading);for(const [label,value] of Object.entries({Status:report.status,Created:report.created_at,Details:report.details,Listing:report.listing_id,Reported_user:report.reported_id,Report_ID:report.id})){const p=document.createElement('p');const strong=document.createElement('strong');strong.textContent=label.replace('_',' ')+': ';p.append(strong,document.createTextNode(String(value??'—')));div.append(p)}const controls=document.createElement('div');controls.style.display='flex';controls.style.gap='8px';controls.style.flexWrap='wrap';for(const [label,status] of [['Mark reviewing','reviewing'],['Resolve report','resolved'],['Reopen','open']]){const button=document.createElement('button');button.textContent=label;button.addEventListener('click',async()=>{if(!confirm('Change report status to '+status+'?'))return;button.disabled=true;const {error}=await client.rpc('review_deckplay_report',{p_report_id:report.id,p_status:status});if(error){alert(error.message);button.disabled=false;return}location.reload()});controls.append(button)}if(report.listing_id){const button=document.createElement('button');button.textContent='Remove reported listing';button.style.background='#a12a2a';button.addEventListener('click',async()=>{if(!confirm('Remove this active listing from DeckPlay? This is an administrative action.'))return;button.disabled=true;const {error}=await client.rpc('hide_deckplay_listing',{p_listing_id:report.listing_id,p_report_id:report.id});if(error){alert(error.message);button.disabled=false;return}alert('Listing removed.');location.reload()});controls.append(button)}div.append(controls);out.append(div)}}catch(error){state.textContent='Unable to load moderation queue: '+error.message}})();</script></body></html>
